<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Background - Tailwind CSS + Vanilla JS</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* CSS Keyframes untuk Animasi Float */
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-15px) rotate(5deg); }
            66% { transform: translateY(15px) rotate(-5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        .animate-float-js {
            animation-name: float;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        /* Gaya tambahan untuk Grid (meniru style={{ backgroundImage: ... }}) */
        .background-grid {
            background-image: 
                linear-gradient(#64748b 1px, transparent 1px), 
                linear-gradient(90deg, #64748b 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="antialiased dark:bg-slate-950">

    <div id="background-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0 bg-slate-100 dark:bg-slate-950 transition-colors duration-500">
        
        <div class="absolute inset-0 bg-gradient-to-br from-slate-200/80 via-transparent to-blue-100/50 dark:from-slate-900 dark:via-slate-950 dark:to-blue-900/40"></div>

        <div class="absolute inset-0 opacity-[0.15] dark:opacity-[0.2] background-grid">
        </div>

        <div id="particles-container">
            </div>
    </div>

    <div class="relative z-10 p-10 text-center">
        <h1 class="text-4xl font-bold text-gray-800 dark:text-gray-100">Contoh Konten Aplikasi</h1>
        <p class="text-gray-600 dark:text-gray-300 mt-2">Latar belakang dinamis berjalan di belakang.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const symbols = [
                // Math
                "∑", "∫", "π", "√", "∞", "∆", "∂", "∇", "∀", "∃", "∈", "≠", "≈", 
                "sin", "cos", "tan", "log", "ln", "lim", "f(x)", "dy/dx", 
                "x", "y", "z", "α", "β", "θ", "λ",
                // Physics
                "Ω", "μ", "E=mc²", "F=ma", "λ", "ν", "ℏ", "ρ", "Φ", "Ψ", "ω",
                // Chemistry
                "H₂O", "CO₂", "NaCl", "O₂", "pH", "H⁺", "e⁻", "⏣", "⌬", "⚛", "→", "⇌"
            ];
            
            const colors = [
                'text-blue-600/40 dark:text-blue-400/50',
                'text-purple-600/40 dark:text-purple-400/50',
                'text-slate-600/40 dark:text-slate-400/50',
                'text-indigo-600/40 dark:text-indigo-400/50',
                'text-cyan-600/40 dark:text-cyan-400/50',
                'text-emerald-600/40 dark:text-emerald-400/50'
            ];

            const cols = 10;
            const rows = 20;
            const particlesContainer = document.getElementById('particles-container');

            function createParticles() {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        // Logika Posisi Acak (mereplikasi useMemo)
                        const baseX = (c / cols) * 100;
                        const baseY = (r / rows) * 100;
                        const randomX = (Math.random() * (100 / cols)); 
                        const randomY = (Math.random() * (100 / rows));

                        const char = symbols[Math.floor(Math.random() * symbols.length)];
                        const colorClass = colors[Math.floor(Math.random() * colors.length)];
                        const size = Math.random() * 1.5 + 1.0 + "rem";
                        const duration = Math.random() * 40 + 30 + "s";
                        const delay = Math.random() * -50 + "s";
                        const opacity = Math.random() * 0.4 + 0.3;
                        const rotation = Math.floor(Math.random() * 360);

                        // Membuat elemen DIV (mereplikasi JSX)
                        const particle = document.createElement('div');
                        particle.textContent = char;
                        
                        // Menambahkan class Tailwind dan class Animasi
                        particle.className = `absolute font-mono font-bold select-none animate-float-js ${colorClass}`;
                        
                        // Menambahkan style inline
                        particle.style.left = (baseX + randomX) + "%";
                        particle.style.top = (baseY + randomY) + "%";
                        particle.style.fontSize = size;
                        particle.style.opacity = opacity;
                        particle.style.transform = `rotate(${rotation}deg)`;
                        particle.style.animationDuration = duration;
                        particle.style.animationDelay = delay;
                        particle.style.filter = 'blur(0.3px)';
                        particle.style.zIndex = '-1';
                        particle.style.textShadow = '0 0 5px rgba(255,255,255,0.1)';

                        particlesContainer.appendChild(particle);
                    }
                }
            }

            createParticles();
        });
    </script>

</body>
</html>
