<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Background — Tailwind + Vanilla JS</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-15px) rotate(5deg); }
            66% { transform: translateY(15px) rotate(-5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        .animate-float-js {
            animation-name: float;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            will-change: transform;
        }

        .background-grid {
            background-image:
                linear-gradient(#64748b 1px, transparent 1px),
                linear-gradient(90deg, #64748b 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>

<body class="antialiased bg-slate-100 dark:bg-slate-950 transition-colors duration-500">

    <!-- Background Layer -->
    <div id="background-container"
        class="fixed inset-0 pointer-events-none overflow-hidden z-0">

        <!-- Lapisan gradasi -->
        <div class="absolute inset-0 bg-gradient-to-br
            from-slate-200/80 via-transparent to-blue-100/50
            dark:from-slate-900 dark:via-slate-950 dark:to-blue-900/40">
        </div>

        <!-- Grid background -->
        <div class="absolute inset-0 opacity-[0.12] dark:opacity-[0.18] background-grid"></div>

        <!-- Container Partikel -->
        <div id="particles-container"></div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="relative z-10 p-10 text-center select-none">
        <h1 class="text-4xl font-bold text-gray-800 dark:text-gray-100">Contoh Konten Aplikasi</h1>
        <p class="text-gray-600 dark:text-gray-300 mt-2">Latar belakang dinamis berjalan di belakang.</p>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const symbols = [
                "∑","∫","π","√","∞","∆","∂","∇","∀","∃","∈","≠","≈",
                "sin","cos","tan","log","ln","lim","f(x)","dy/dx",
                "x","y","z","α","β","θ","λ",
                "Ω","μ","E=mc²","F=ma","ν","ℏ","ρ","Φ","Ψ","ω",
                "H₂O","CO₂","NaCl","O₂","pH","H⁺","e⁻","⚛","→","⇌"
            ];

            const colors = [
                'text-blue-500/40 dark:text-blue-400/45',
                'text-purple-500/40 dark:text-purple-400/45',
                'text-slate-500/40 dark:text-slate-400/45',
                'text-indigo-500/40 dark:text-indigo-400/45',
                'text-cyan-500/40 dark:text-cyan-400/45',
                'text-emerald-500/40 dark:text-emerald-400/45'
            ];

            const cols = 10;
            const rows = 20;
            const container = document.getElementById("particles-container");

            // cegah duplikasi partikel (super penting)
            container.innerHTML = "";

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = (c / cols) * 100 + Math.random() * (100 / cols);
                    const y = (r / rows) * 100 + Math.random() * (100 / rows);

                    const char = symbols[Math.floor(Math.random() * symbols.length)];
                    const color = colors[Math.floor(Math.random() * colors.length)];

                    const p = document.createElement("div");
                    p.textContent = char;
                    p.className = `absolute font-mono font-bold animate-float-js ${color}`;

                    p.style.left = x + "%";
                    p.style.top = y + "%";
                    p.style.fontSize = `${Math.random() * 1.4 + 0.9}rem`;
                    p.style.opacity = Math.random() * 0.4 + 0.25;
                    p.style.animationDuration = `${Math.random() * 30 + 35}s`;
                    p.style.animationDelay = `${Math.random() * -40}s`;
                    p.style.filter = "blur(0.3px)";
                    p.style.transform = `rotate(${Math.floor(Math.random() * 360)}deg)`;

                    container.appendChild(p);
                }
            }
        });
    </script>

</body>
</html>
