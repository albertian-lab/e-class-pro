<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Pelajaran</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-slate-800 transition-colors duration-300">

<div id="schedule-container" class="max-w-5xl mx-auto p-6 space-y-6">

  <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <h1 class="text-3xl font-bold text-slate-800 dark:text-white">Jadwal Pelajaran</h1>
      <p class="text-slate-500 dark:text-slate-400">Jadwal aktif Semester 1 TP 2025/2026.</p>
    </div>
    <div class="w-full md:w-auto">
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1" for="class-select">Pilih Kelas</label>
      <select id="class-select" class="w-full md:w-48 rounded-lg border-slate-300 bg-white dark:bg-slate-800 dark:border-slate-700 text-slate-900 dark:text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2"></select>
    </div>
  </header>

  <div id="schedule-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>

</div>

<script>
// --- DATA ---
const CLASSES = ['11P01','11P02','11P03'];
const SCHEDULES = {
  '11P01': [
    { day: 'Senin', lessons: [{ time: '07:00', subject: 'Matematika', code: 'MTH101' }, { time: '08:00', subject: 'ISTIRAHAT' }] },
    { day: 'Selasa', lessons: [{ time: '07:00', subject: 'Fisika', code: 'PHY101' }] }
  ],
  '11P02': [
    { day: 'Senin', lessons: [{ time: '07:00', subject: 'Bahasa Indonesia', code: 'IND101' }] }
  ],
  '11P03': []
};

// --- INIT SELECT ---
const classSelect = document.getElementById('class-select');
CLASSES.forEach(c => {
  const option = document.createElement('option');
  option.value = c;
  option.textContent = c;
  classSelect.appendChild(option);
});

// --- RENDER FUNCTION ---
const scheduleGrid = document.getElementById('schedule-grid');

function renderSchedule(selectedClass) {
  const currentSchedule = SCHEDULES[selectedClass] || [];
  scheduleGrid.innerHTML = '';

  currentSchedule.forEach(daySchedule => {
    const card = document.createElement('div');
    card.className = 'bg-white dark:bg-slate-900 rounded-xl shadow-lg border border-slate-200 dark:border-slate-800 overflow-hidden hover:border-blue-400 dark:hover:border-blue-600 transition-all duration-300 group';

    let lessonsHtml = '';
    daySchedule.lessons.forEach(lesson => {
      const borderColor = lesson.subject === 'ISTIRAHAT' ? 'border-yellow-300 dark:border-yellow-600' : 'border-slate-200 dark:border-slate-700';
      const dotColor = lesson.subject === 'ISTIRAHAT' ? 'bg-yellow-400' : 'bg-blue-500';
      const textColor = lesson.subject === 'ISTIRAHAT' ? 'text-slate-500 italic' : 'text-slate-900 dark:text-white';
      const timeColor = lesson.subject === 'ISTIRAHAT' ? 'text-yellow-600 dark:text-yellow-500' : 'text-blue-600 dark:text-blue-400';

      lessonsHtml += `
        <li class="relative pl-6 border-l-2 ${borderColor} pb-2 last:pb-0 last:border-0">
          <div class="absolute -left-[5px] top-1.5 w-2.5 h-2.5 rounded-full ${dotColor} ring-4 ring-white dark:ring-slate-900"></div>
          <div class="flex flex-col">
            <span class="text-xs font-semibold flex items-center gap-1 mb-0.5 ${timeColor}">
              ${lesson.time}
            </span>
            <span class="text-sm font-bold ${textColor}">
              ${lesson.subject}
            </span>
            ${lesson.code && lesson.subject !== 'ISTIRAHAT' ? `<span class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1 mt-1">Kode: ${lesson.code}</span>` : ''}
          </div>
        </li>
      `;
    });

    card.innerHTML = `
      <div class="bg-slate-50 dark:bg-slate-800/50 p-4 border-b border-slate-200 dark:border-slate-800 group-hover:bg-blue-50 dark:group-hover:bg-blue-900/20 transition-colors">
        <div class="flex items-center gap-2">
          <span class="font-bold text-lg text-slate-800 dark:text-white uppercase tracking-wider">${daySchedule.day}</span>
        </div>
      </div>
      <div class="p-4">
        <ul class="space-y-3">
          ${lessonsHtml}
        </ul>
      </div>
    `;

    scheduleGrid.appendChild(card);
  });
}

// Initial render
renderSchedule(classSelect.value);

// Event listener
classSelect.addEventListener('change', (e) => {
  renderSchedule(e.target.value);
});
</script>

</body>
</html>
