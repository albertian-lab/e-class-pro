<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar E-Class Pro - HTML/Tailwind/JS</title>
    <!-- Tautan ke Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Keyframe untuk Animasi Atom Logo */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 15s linear infinite;
        }

        /* Initial state for mobile menu (hidden by default on small screens) */
        #mobile-menu {
            display: none;
        }
        /* Overriding Tailwind's default display property when menu is explicitly shown by JS */
        .mobile-menu-open {
            display: block !important;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-500">

    <!-- Navbar (Replikasi Komponen Navbar.tsx) -->
    <nav id="main-navbar" class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 dark:border-slate-700 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                
                <!-- Logo Section -->
                <div class="flex items-center">
                    <a id="logo-link" href="#/" class="flex-shrink-0 flex items-center gap-3 group select-none">
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30 group-hover:scale-105 transition-transform">
                            <!-- Atom Icon SVG -->
                            <svg id="atom-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin-slow">
                                <circle cx="12" cy="12" r="2"></circle><path d="M12 2A10 10 0 0 0 6.61 5.92M12 2v20A10 10 0 0 1 17.39 18.08M12 22A10 10 0 0 0 17.39 18.08M12 22v-4"></path><path d="M21.99 13.97a10 10 0 0 0-4.05-4.05M2 9.77a10 10 0 0 1 4.05-4.05M2 13.97l20-4.2M2 9.77l20 4.2"></path>
                            </svg>
                        </div>
                        <div class="flex flex-col justify-center h-10">
                            <span class="font-black text-xl text-slate-800 dark:text-white tracking-tighter leading-none">E-CLASS</span>
                            <span class="text-[0.65rem] font-bold text-blue-600 dark:text-blue-400 uppercase tracking-[0.38em] leading-none mt-1">PRO</span>
                        </div>
                    </a>
                </div>

                <!-- Desktop Menu & Theme Toggle -->
                <div class="hidden md:flex items-center space-x-2">
                    <div id="desktop-nav-links" class="flex items-center space-x-2">
                        <!-- Navigation Links Dibuat oleh JS -->
                    </div>
                    
                    <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 mx-2"></div>
                    
                    <button id="theme-toggle-desktop" class="p-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-blue-100 dark:hover:bg-blue-900/30 hover:text-blue-600 dark:hover:text-blue-400 transition-colors" aria-label="Toggle Theme">
                        <!-- Icon akan diganti oleh JS -->
                        <svg id="theme-icon-desktop" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                    </button>
                </div>

                <!-- Mobile menu button & Theme Toggle Mobile -->
                <div class="md:hidden flex items-center">
                    <button id="theme-toggle-mobile" class="mr-2 p-2 rounded-md text-slate-600 dark:text-slate-300" aria-label="Toggle Theme">
                        <!-- Icon akan diganti oleh JS -->
                        <svg id="theme-icon-mobile" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                    </button>
                    <button id="mobile-menu-button" class="p-2 rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none" aria-label="Toggle Mobile Menu">
                        <!-- Icon akan diganti oleh JS -->
                        <svg id="mobile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu (isOpen && ...) -->
        <div id="mobile-menu" class="md:hidden bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 absolute w-full shadow-xl">
            <div id="mobile-nav-links" class="px-4 pt-2 pb-4 space-y-2">
                <!-- Navigation Links Dibuat oleh JS -->
            </div>
        </div>
    </nav>
