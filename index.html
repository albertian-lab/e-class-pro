<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Class Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Konfigurasi Tailwind Anda
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a', 
                        secondary: '#1e293b',
                        accent: '#3b82f6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 20s infinite ease-in-out',
                        'spin-slow': 'spin 8s linear infinite',
                        'pop-in': 'popIn 0.3s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '33%': { transform: 'translateY(-20px) rotate(5deg)' },
                            '66%': { transform: 'translateY(20px) rotate(-5deg)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 overflow-x-hidden font-sans selection:bg-blue-500 selection:text-white">

    <div id="app" class="min-h-screen">
        <header class="p-4 bg-primary text-white sticky top-0 z-50 shadow-lg">
            <h1 class="text-xl font-bold">E-Class Pro (Vanilla JS)</h1>
            <button id="theme-toggle" class="absolute right-4 top-4 p-2 rounded-full hover:bg-slate-700">
                🌙
            </button>
        </header>
        
        <main id="main-content" class="p-4 md:p-8">
            <p>Silakan isi struktur HTML aplikasi Anda di sini, atau gunakan JavaScript untuk merendernya ke dalam elemen ini.</p>
        </main>

    </div>

    <script src="script.js"></script> 
</body>
</html>
