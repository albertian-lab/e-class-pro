<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Class Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a', 
                        secondary: '#1e293b',
                        accent: '#3b82f6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 20s infinite ease-in-out',
                        'spin-slow': 'spin 8s linear infinite',
                        'pop-in': 'popIn 0.3s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '33%': { transform: 'translateY(-20px) rotate(5deg)' },
                            '66%': { transform: 'translateY(20px) rotate(-5deg)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1"
  }
}
</script>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 overflow-x-hidden font-sans selection:bg-blue-500 selection:text-white">

    <!-- Background Container -->
    <div id="background-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-slate-200/80 via-transparent to-blue-100/50 dark:from-slate-900 dark:via-slate-950 dark:to-blue-900/40"></div>
        <div class="absolute inset-0 opacity-[0.15] dark:opacity-[0.2]" style="background-image: linear-gradient(#64748b 1px, transparent 1px), linear-gradient(90deg, #64748b 1px, transparent 1px); background-size: 40px 40px;"></div>
        <!-- Particles injected by JS -->
    </div>

    <!-- Navbar -->
    <nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 dark:border-slate-700 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center justify-center">
                    <a href="#" onclick="app.router.navigate('home'); return false;" class="flex-shrink-0 flex items-center gap-3 group select-none">
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30 group-hover:scale-105 transition-transform">
                            <i data-lucide="atom" class="animate-spin-slow"></i>
                        </div>
                        <div class="flex flex-col justify-center h-10">
                            <span class="font-black text-xl text-slate-800 dark:text-white tracking-tighter leading-none">E-CLASS</span>
                            <span class="text-[0.65rem] font-bold text-blue-600 dark:text-blue-400 uppercase tracking-[0.38em] leading-none mt-1">PRO</span>
                        </div>
                    </a>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-2">
                    <button onclick="app.router.navigate('home')" class="nav-btn flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-blue-600 dark:hover:text-blue-300 text-slate-600 dark:text-slate-300" data-target="home">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Home
                    </button>
                    <button onclick="app.router.navigate('attendance')" class="nav-btn flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-blue-600 dark:hover:text-blue-300 text-slate-600 dark:text-slate-300" data-target="attendance">
                        <i data-lucide="activity" class="w-4 h-4"></i> Absensi
                    </button>
                    <button onclick="app.router.navigate('schedule')" class="nav-btn flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-blue-600 dark:hover:text-blue-300 text-slate-600 dark:text-slate-300" data-target="schedule">
                        <i data-lucide="calendar" class="w-4 h-4"></i> Jadwal
                    </button>
                    <button onclick="app.router.navigate('assignments')" class="nav-btn flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-blue-600 dark:hover:text-blue-300 text-slate-600 dark:text-slate-300" data-target="assignments">
                        <i data-lucide="book-open" class="w-4 h-4"></i> Tugas
                    </button>
                    <button onclick="app.router.navigate('groups')" class="nav-btn flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-blue-600 dark:hover:text-blue-300 text-slate-600 dark:text-slate-300" data-target="groups">
                        <i data-lucide="users" class="w-4 h-4"></i> Kelompok
                    </button>
                    <button onclick="app.router.navigate('admin')" class="nav-btn flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-blue-600 dark:hover:text-blue-300 text-slate-600 dark:text-slate-300" data-target="admin">
                        <i data-lucide="shield" class="w-4 h-4"></i> Admin
                    </button>
                    
                    <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 mx-2"></div>
                    
                    <button onclick="app.helpers.toggleTheme()" class="p-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-blue-100 dark:hover:bg-blue-900/30 transition-colors">
                        <i data-lucide="moon" class="block dark:hidden w-4 h-4"></i>
                        <i data-lucide="sun" class="hidden dark:block w-4 h-4"></i>
                    </button>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button onclick="app.helpers.toggleTheme()" class="mr-2 p-2 rounded-md text-slate-600 dark:text-slate-300">
                        <i data-lucide="moon" class="block dark:hidden w-5 h-5"></i>
                        <i data-lucide="sun" class="hidden dark:block w-5 h-5"></i>
                    </button>
                    <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="p-2 rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 absolute w-full shadow-xl">
            <div class="px-4 pt-2 pb-4 space-y-2">
                <a href="#" onclick="app.router.navigate('home'); return false;" class="flex items-center gap-3 px-3 py-2 rounded-md text-base font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Home</a>
                <a href="#" onclick="app.router.navigate('attendance'); return false;" class="flex items-center gap-3 px-3 py-2 rounded-md text-base font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="activity" class="w-5 h-5"></i> Absensi</a>
                <a href="#" onclick="app.router.navigate('schedule'); return false;" class="flex items-center gap-3 px-3 py-2 rounded-md text-base font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="calendar" class="w-5 h-5"></i> Jadwal</a>
                <a href="#" onclick="app.router.navigate('assignments'); return false;" class="flex items-center gap-3 px-3 py-2 rounded-md text-base font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="book-open" class="w-5 h-5"></i> Tugas</a>
                <a href="#" onclick="app.router.navigate('groups'); return false;" class="flex items-center gap-3 px-3 py-2 rounded-md text-base font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="users" class="w-5 h-5"></i> Kelompok</a>
                <a href="#" onclick="app.router.navigate('admin'); return false;" class="flex items-center gap-3 px-3 py-2 rounded-md text-base font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="shield" class="w-5 h-5"></i> Admin</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area (SPA Render Target) -->
    <main id="app" class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10 min-h-screen">
        <!-- Content will be injected here by script.js -->
    </main>

    <footer class="relative z-10 bg-white/80 dark:bg-slate-900/80 backdrop-blur text-center py-6 text-sm text-slate-500 dark:text-slate-400 border-t border-slate-200 dark:border-slate-800 mt-auto">
        <p>© 2025 E-Class Pro. Created for Educational Purposes.</p>
    </footer>

    <!-- Logic -->
    <script src="script.js"></script>
</body>
</html>
